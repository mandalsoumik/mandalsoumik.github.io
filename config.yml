baseURL: "https://mandalsoumik.github.io/"
title: Soumik Mandal
theme: PaperMod
enableInlineShortcodes: true
enableRobotsTXT: true

pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Papers
          url: papers/
          weight: 1
        - name: Teaching
          url: courses/
          weight: 2
        - name: Data
          url: data/
          weight: 3

params:
    description: "Personal website of Soumik Mandal - Digital Health Researcher"
    author: Soumik Mandal
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","courses","data"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    
    profileMode:
          enabled: true
          title: Soumik Mandal
          subtitle: "I am a research scientist in the Department of Population Health at NYU Langone Health. My research focuses on user engagement with digital health technologies."
          imageUrl: "picture.jpg"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Papers
              url: papers/
            - name: Teaching
              url: courses/
            - name: Data
              url: data/
            - name: CV
              url: cv.pdf
              
    socialIcons:
        - name: Email
          url: mailto:soumik.mandal@nyulangone.org
        - name: Google Scholar
          url: https://scholar.google.com/
        - name: GitHub
          url: https://github.com/mandalsoumik
          
    assets:
        disableScrollBarStyle: true
        
    cover:
        hiddenInList: false
        hiddenInSingle: true
        
    label:
      text: "Soumik Mandal"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2